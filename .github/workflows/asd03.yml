name: ASD03 reproduction
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -e ".[training,app,visualization,evaluation,test]"
          .venv/bin/python reproduction/asd03/runtime.py install
          .venv/bin/python -m pip check
      - name: Check reproduction
        env:
          PYTHONPATH: reproduction/asd03:src
        run: |
          .venv/bin/python -m pytest reproduction/asd03/tests tests/test_core.py tests/test_readme.py -q
          .venv/bin/python -m runtime asdkit.bin.train --config-dir "$PWD/reproduction/asd03/config/train" --help
          .venv/bin/python scripts/update_readme.py --check
          .venv/bin/marimo export html apps/02_b0_b1_w1_ss.py -o "$RUNNER_TEMP/asd02.html"
