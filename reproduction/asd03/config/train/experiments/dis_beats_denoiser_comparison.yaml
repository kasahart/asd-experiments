# @package _global_
# ASDKit由来の変更設定。callback・必須ラベル入力・runtime frontendを追加。
# LoRAをrank64/q,k,vに指定し、num_workers=8・sec=10・lr_min=1e-4を明示。
# 参照元: https://github.com/TakuyaFujimura/dcase-asd-toolkit/blob/7601d673ef2ed5a2424965cac755365cf7112c5f/config/train/experiments/dis_beats_scac_trainable.yaml
# 原MIT通知: licenses/research-MIT.txt（リポジトリルート基準）。
defaults:
  - override /datamodule: basic
  - override /frontend: dis_beats
  - override /trainer: default
  - override /callback: denoiser_comparison

label_dict_path:
  main: ???
model_ver: all
trainer:
  max_epochs: 25
datamodule:
  batch_size: 8
  num_workers: 8
  sec: 10
frontend:
  tgt_class: runtime.FrequencyDisPLModel
  save_only_trainable: true
  model_cfg:
    extractor_cfg:
      lora_cfg:
        r: 64
        target_modules: [q_proj, k_proj, v_proj]
      model_cfg:
        ckpt_path: pretrained_models/beats/BEATs_iter3.pt
        specaug: false
    loss_cfg:
      tgt_class: asdkit.losses.SCAdaCos
      n_subclusters: 16
      dynamic: false
      trainable: true
    augmentation_cfg_list:
      - tgt_class: asdkit.augmentations.Mixup
        prob: 0.5
  optim_cfg:
    tgt_class: torch.optim.AdamW
    lr: 1.0e-4
  lrscheduler_cfg:
    tgt_class: timm.scheduler.CosineLRScheduler
    t_initial: 5001
    lr_min: 1.0e-4
    warmup_t: 5000
    warmup_lr_init: 0
