[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"
[project]
name = "asd-experiments"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "src/asd_min/beats/LICENSE", "src/asd_min/beats/NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "soundfile>=0.12", "torch==2.7.1", "torchaudio==2.7.1"]
[project.optional-dependencies]
visualization = ["wandas==0.8.0", "matplotlib", "pandas"]
app = ["marimo==0.25.1"]
training = [
    "torchvision==0.22.1",
    "lightning==2.6.6",
    "peft==0.21.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "soundfile==0.14.0",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "timm==1.0.29",
    "pandas==2.3.3",
    "pydantic==2.13.5",
    "tensorboard==2.21.0",
    "imbalanced-learn==0.14.2",
    "tqdm==4.70.1",
    "threadpoolctl==3.7.0",
    "setuptools==79.0.1",
    "wheel==0.45.1",
]
evaluation = ["scipy==1.17.1", "scikit-learn==1.9.1", "pandas==2.3.3", "matplotlib", "librosa", "seaborn", "setuptools==79.0.1"]
test = ["pytest"]
[project.scripts]
asd-article = "asd_min.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"asd_min.beats" = ["LICENSE", "NOTICE.md"]
